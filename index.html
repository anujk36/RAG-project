<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RAG Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-1">RAG Assistant</h1>
        <p class="text-sm text-gray-500 mb-6" id="statusText">Checking connection...</p>

        <div class="flex gap-2 mb-6">
            <input
                id="questionInput"
                type="text"
                placeholder="Ask something about your documents..."
                class="flex-1 border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                onkeydown="if(event.key === 'Enter') askQuestion()"
            >
            <button
                onclick="askQuestion()"
                id="askButton"
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg transition"
            >
                Ask
            </button>
        </div>

        <div id="answerBox" class="hidden bg-gray-50 border border-gray-200 rounded-lg p-4 text-gray-800"></div>
        <div id="errorBox" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-lg p-4"></div>

        <hr class="my-6 border-gray-200">

        <h2 class="text-lg font-semibold text-gray-800 mb-3">Add a document</h2>
        <div class="flex gap-2 mb-2">
            <input
                id="pdfInput"
                type="file"
                accept="application/pdf"
                class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:bg-gray-100 file:text-gray-700 file:text-sm"
            >
            <button
                onclick="uploadPdf()"
                id="uploadButton"
                class="bg-gray-800 hover:bg-gray-900 text-white font-medium px-5 py-2 rounded-lg transition text-sm"
            >
                Upload
            </button>
        </div>
        <p id="uploadStatus" class="text-sm mb-4"></p>

        <h3 class="text-sm font-medium text-gray-500 mb-2">Indexed documents</h3>
        <ul id="documentList" class="text-sm text-gray-700 space-y-1 list-disc list-inside"></ul>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        async function checkHealth() {
            const statusText = document.getElementById("statusText");
            try {
                const res = await fetch(`${API_URL}/health`);
                if (res.ok) {
                    statusText.innerText = "Connected to RAG backend";
                    statusText.className = "text-sm text-green-600 mb-6";
                } else {
                    throw new Error("Backend unhealthy");
                }
            } catch (e) {
                statusText.innerText = "Cannot reach backend — is the server running?";
                statusText.className = "text-sm text-red-600 mb-6";
            }
        }

        async function askQuestion() {
            const input = document.getElementById("questionInput");
            const answerBox = document.getElementById("answerBox");
            const errorBox = document.getElementById("errorBox");
            const button = document.getElementById("askButton");

            const question = input.value.trim();
            if (!question) return;

            answerBox.classList.add("hidden");
            errorBox.classList.add("hidden");
            button.disabled = true;
            button.innerText = "Thinking...";

            try {
                const res = await fetch(`${API_URL}/ask`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: question })
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.detail || "Something went wrong.");
                }

                const data = await res.json();
                answerBox.innerHTML = "";

                const textEl = document.createElement("div");
                textEl.className = "whitespace-pre-wrap";
                textEl.innerText = data.answer;
                answerBox.appendChild(textEl);

                if (data.images && data.images.length > 0) {
                    const imagesEl = document.createElement("div");
                    imagesEl.className = "mt-4 grid grid-cols-2 gap-3";
                    data.images.forEach(imgPath => {
                        const img = document.createElement("img");
                        img.src = `${API_URL}/images/${imgPath}`;
                        img.className = "rounded-lg border border-gray-200 w-full object-cover";
                        imagesEl.appendChild(img);
                    });
                    answerBox.appendChild(imagesEl);
                }

                answerBox.classList.remove("hidden");

            } catch (e) {
                errorBox.innerText = e.message;
                errorBox.classList.remove("hidden");
            } finally {
                button.disabled = false;
                button.innerText = "Ask";
            }
        }

        async function loadDocuments() {
            const list = document.getElementById("documentList");
            try {
                const res = await fetch(`${API_URL}/documents`);
                const data = await res.json();
                list.innerHTML = "";
                if (!data.documents || data.documents.length === 0) {
                    list.innerHTML = "<li class='text-gray-400 list-none'>No documents indexed yet.</li>";
                    return;
                }
                data.documents.forEach(name => {
                    const li = document.createElement("li");
                    li.innerText = name;
                    list.appendChild(li);
                });
            } catch (e) {
                list.innerHTML = "<li class='text-gray-400 list-none'>Could not load document list.</li>";
            }
        }

        async function uploadPdf() {
            const input = document.getElementById("pdfInput");
            const status = document.getElementById("uploadStatus");
            const button = document.getElementById("uploadButton");

            const file = input.files[0];
            if (!file) {
                status.innerText = "Choose a PDF first.";
                status.className = "text-sm mb-4 text-red-600";
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            button.disabled = true;
            button.innerText = "Uploading...";
            status.innerText = "Uploading and indexing — this can take a moment if the PDF has images...";
            status.className = "text-sm mb-4 text-gray-500";

            try {
                const res = await fetch(`${API_URL}/upload`, {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Upload failed.");
                }

                status.innerText = `Indexed "${data.filename}": ${data.text_chunks} text chunks, ${data.images} images.`;
                status.className = "text-sm mb-4 text-green-600";
                input.value = "";
                loadDocuments();

            } catch (e) {
                status.innerText = e.message;
                status.className = "text-sm mb-4 text-red-600";
            } finally {
                button.disabled = false;
                button.innerText = "Upload";
            }
        }

        checkHealth();
        loadDocuments();
    </script>
</body>
</html>
